name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt a production migration or deployment with a newer push.
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Preserve existing migrations
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_REVISION" ] && [ "$BASE_REVISION" != '0000000000000000000000000000000000000000' ]; then
            npm run check:migrations -- "$BASE_REVISION"
          else
            npm run check:migrations -- HEAD
          fi
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build:cloudflare
      - run: npm run check:jobs
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks release
        run: |
          curl --fail --location --silent --show-error --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan repository history
        run: /tmp/gitleaks git --redact=100 --log-opts=--all
  deploy:
    name: Deploy private production
    needs: [checks, secrets]
    if: >-
      github.repository == 'YQ-Wang/ClioForge' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://clioforge.com
    env:
      CLIOFORGE_CONFIG: wrangler.ci.local.jsonc
      CLIOFORGE_JOBS_CONFIG: wrangler.jobs.ci.local.jsonc
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare private deployment configuration
        env:
          CLIOFORGE_APP_CONFIG: ${{ secrets.CLIOFORGE_APP_CONFIG }}
          CLIOFORGE_RESEARCH_CONFIG: ${{ secrets.CLIOFORGE_RESEARCH_CONFIG }}
        run: node scripts/prepare-ci-deployment.mjs
      - run: npm run build:cloudflare
      - run: npm run check:jobs
      - name: Skip superseded revisions
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main commit exists; leaving production unchanged.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Migrate and deploy both Workers
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing production Cloudflare token'; exit 1; }
          npm run db:migrate:remote
          npm run deploy:jobs
          npm run deploy:cloudflare
      - name: Verify private access after deployment
        if: steps.revision.outputs.current == 'true'
        run: node scripts/validate-private-deployment.mjs https://clioforge.com
      - name: Record deployed revision
        if: success() && steps.revision.outputs.current == 'true'
        run: |
          echo "Deployed commit $GITHUB_SHA to https://clioforge.com" >> "$GITHUB_STEP_SUMMARY"
          echo 'Application and research Workers deployed; private-access checks passed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove deployment configuration
        if: always()
        run: rm -f -- "$CLIOFORGE_CONFIG" "$CLIOFORGE_JOBS_CONFIG"
